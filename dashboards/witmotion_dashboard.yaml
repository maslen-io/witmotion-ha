title: WitMotion Precision Dynamics
views:
  - title: Live Telemetry
    path: live
    icon: mdi:axis-arrow
    type: masonry
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: HWT9053-485 Reference Inclinometer (USB)
            show_header_toggle: false
            entities:
              - entity: sensor.hwt9053_roll
                name: Roll (X-Angle)
              - entity: sensor.hwt9053_pitch
                name: Pitch (Y-Angle)
              - entity: sensor.hwt9053_yaw
                name: Yaw (Z-Angle)
              - type: divider
              - entity: sensor.hwt9053_acc_x
                name: Acceleration X
              - entity: sensor.hwt9053_acc_y
                name: Acceleration Y
              - entity: sensor.hwt9053_acc_z
                name: Acceleration Z
              - type: divider
              - entity: sensor.hwt9053_temperature
                name: Internal Die Temperature
          - type: history-graph
            title: HWT9053 - 24h Precision Tilt (Roll & Pitch)
            hours_to_show: 24
            entities:
              - entity: sensor.hwt9053_roll
                name: Roll
              - entity: sensor.hwt9053_pitch
                name: Pitch
      - type: vertical-stack
        cards:
          - type: entities
            title: WT901BLE68 9-Axis AHRS (Bluetooth)
            show_header_toggle: false
            entities:
              - entity: sensor.wt901ble68_roll
                name: Roll (X-Angle)
              - entity: sensor.wt901ble68_pitch
                name: Pitch (Y-Angle)
              - entity: sensor.wt901ble68_yaw
                name: Yaw (Z-Angle)
              - type: divider
              - entity: sensor.wt901ble68_acc_x
                name: Acceleration X
              - entity: sensor.wt901ble68_acc_y
                name: Acceleration Y
              - entity: sensor.wt901ble68_acc_z
                name: Acceleration Z
          - type: history-graph
            title: WT901BLE68 - 24h Orientation Angles
            hours_to_show: 24
            entities:
              - entity: sensor.wt901ble68_roll
                name: Roll
              - entity: sensor.wt901ble68_pitch
                name: Pitch
              - entity: sensor.wt901ble68_yaw
                name: Yaw
      - type: vertical-stack
        cards:
          - type: entities
            title: WTVB01-BT50 Structural Vibration (Bluetooth)
            show_header_toggle: false
            entities:
              - entity: sensor.wtvb01_disp_x
                name: Displacement X (µm)
              - entity: sensor.wtvb01_disp_y
                name: Displacement Y (µm)
              - entity: sensor.wtvb01_disp_z
                name: Displacement Z (µm)
              - type: divider
              - entity: sensor.wtvb01_freq_x
                name: Frequency X (Hz)
              - entity: sensor.wtvb01_freq_y
                name: Frequency Y (Hz)
              - entity: sensor.wtvb01_freq_z
                name: Frequency Z (Hz)
              - type: divider
              - entity: sensor.wtvb01_vel_x
                name: Velocity X (mm/s)
              - entity: sensor.wtvb01_vel_y
                name: Velocity Y (mm/s)
              - entity: sensor.wtvb01_vel_z
                name: Velocity Z (mm/s)
          - type: history-graph
            title: WTVB01 - 24h Vibration Displacement (µm)
            hours_to_show: 24
            entities:
              - entity: sensor.wtvb01_disp_x
                name: Disp X
              - entity: sensor.wtvb01_disp_y
                name: Disp Y
              - entity: sensor.wtvb01_disp_z
                name: Disp Z
